name: odds-scan

on:
  # Scheduling is handled externally by cron-job.org (console.cron-job.org)
  # via the GitHub workflow_dispatch API. Manual runs still work here.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odds-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: football
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write .env
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          printf 'MYSQL_HOST=127.0.0.1\nMYSQL_PORT=3306\nMYSQL_USER=root\nMYSQL_PASSWORD=%s\nMYSQL_DB=football\n' \
            "$MYSQL_ROOT_PASSWORD" > .env

      - name: Init schema
        run: python -m rule_engine.init_db

      - name: Scan, track, and email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python -m rule_engine run \
            --ci \
            --experimental-default \
            --within-minutes 60

      - name: Upload tracker artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-tracking-${{ github.run_id }}
          path: tracking/paper_tracking.xlsx
          if-no-files-found: ignore
