name: odds-scan

on:
  # Scheduling is handled externally by cron-job.org (console.cron-job.org)
  # via the GitHub workflow_dispatch API. Manual runs still work here.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: odds-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: football
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          printf 'MYSQL_HOST=127.0.0.1\nMYSQL_PORT=3306\nMYSQL_USER=root\nMYSQL_PASSWORD=%s\nMYSQL_DB=football\n' \
            "$MYSQL_ROOT_PASSWORD" > .env

      # titan007 closes OpenSSL 3.x TLS connections ("unexpected eof"), and
      # ubuntu-latest ships OpenSSL 3.x. Run the Python stack in an image that
      # provides OpenSSL 1.1.1. --network host lets the containers reach the
      # MySQL service published on the runner at 127.0.0.1:3306.
      - name: Build crawler image (OpenSSL 1.1.1)
        run: |
          docker build -t titan-crawler -f .github/docker/crawler.Dockerfile .
          docker run --rm titan-crawler openssl version
          docker run --rm titan-crawler sh -c 'openssl version | grep -q "^OpenSSL 1\.1\.1"'

      - name: Init schema
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e TZ \
            titan-crawler python -m rule_engine.init_db

      - name: Run scheduler
        env:
          # Three pre-registered windows: conflict T-120m, water T-60m,
          # conflict T-10m. The cron must run at least every ~10 minutes so the
          # T-10m window is not missed.
          SCHEDULE_MIN_ASIAN: "2"
          SCHEDULE_PRICE: "consensus"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_TLS: ${{ secrets.SMTP_TLS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/app" -w /app \
            -e TZ -e SCHEDULE_MIN_ASIAN -e SCHEDULE_PRICE \
            -e SMTP_HOST -e SMTP_PORT -e SMTP_USER -e SMTP_PASSWORD \
            -e SMTP_SSL -e SMTP_TLS -e MAIL_FROM -e MAIL_TO \
            titan-crawler python -m rule_engine.scheduler

      - name: Upload tracker artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-tracking-${{ github.run_id }}
          path: tracking/paper_tracking.csv
          if-no-files-found: ignore

      - name: Commit schedule cache and tracker
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Actions only keeps the schedule cache/state and the CSV tracker.
          # No actionable_*.json, data/*.js, or out/ HTML/JSON is generated.
          for f in data/schedule_cache.json data/scheduler_state.json tracking/paper_tracking.csv; do
            [ -e "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore: scheduler $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
